name: GitGrounded

on:
  pull_request:
    branches: [main]

jobs:
  gitgrounded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - env:
          GITGROUNDED_MODE: demo
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python gitgrounded.py --old origin/main --new HEAD --report report.json

      - uses: actions/github-script@v9
        if: always()
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('report.json', 'utf8'));
            const s = report.summary;
            const body = `## GitGrounded: ${s.verdict}\n\nPASS ${s.pass_count} / WARN ${s.warn_count} / FAIL ${s.fail_count} / total ${s.total_cases}\n\navg groundedness: ${s.avg_groundedness}  avg meaning_drift: ${s.avg_meaning_drift}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });