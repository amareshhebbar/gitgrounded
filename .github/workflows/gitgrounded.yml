name: GitGrounded dogfood

on:
  pull_request:
    paths:
      - "examples/triage/**"
      - "src/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write
  attestations: write

jobs:
  triage-example:
    runs-on: ubuntu-latest
    env:
      GITGROUNDED_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./action
        with:
          version: local
          working-directory: examples/triage
          suite: core
          base: origin/${{ github.base_ref }}
          head: HEAD
          fail-on: never
