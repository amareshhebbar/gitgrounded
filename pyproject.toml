[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "gitgrounded"
dynamic = ["version"]
description = "Auto generated benchmarks, change targeted regression tests and signed, verifiable reports for LLM apps, prompts, models and MCP servers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Amaresh Hebbar", email = "hebbar.gvamaresh@gmail.com" }]
keywords = [
  "llm",
  "evaluation",
  "benchmark",
  "regression-testing",
  "mcp",
  "prompt-engineering",
  "ci",
  "sigstore",
  "mutation-testing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "PyYAML>=6.0",
  "requests>=2.31",
  "openai>=1.40",
  "anthropic>=0.40",
  "python-dotenv>=1.0",
  "jinja2>=3.1",
  "rich>=13.7",
  "pydantic>=2.7",
  "numpy>=1.26",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
coverage = ["sentence-transformers>=3.0"]
mcp = ["mcp>=1.2"]
sign = ["cryptography>=50.0.2", "sigstore>=3.0"]
pdf = ["fpdf2>=2.7", "segno>=1.6"]
dashboard = ["streamlit>=1.35"]
server = ["Flask>=3.0"]
all = ["sentence-transformers>=3.0", "mcp>=1.2", "cryptography>=50.0.2", "sigstore>=3.0", "Flask>=3.0", "fpdf2>=2.7", "segno>=1.6"]
dev = ["pytest>=8", "hypothesis>=6.100", "pytest-cov>=5", "ruff>=0.6", "build", "twine", "cryptography>=50.0.2", "Flask>=3.0", "fpdf2>=2.7", "segno>=1.6"]

[project.urls]
Homepage = "https://github.com/amareshhebbar/gitgrounded"
Documentation = "https://github.com/amareshhebbar/gitgrounded/tree/main/docs"
Source = "https://github.com/amareshhebbar/gitgrounded"
Issues = "https://github.com/amareshhebbar/gitgrounded/issues"
Changelog = "https://github.com/amareshhebbar/gitgrounded/blob/main/CHANGELOG.md"

[project.scripts]
gitgrounded = "gitgrounded.cli.main:main"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.2.0.dev0"

[tool.hatch.build.targets.wheel]
packages = ["src/gitgrounded"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["gitgrounded"]
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
fail_under = 85
skip_covered = true
show_missing = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B023", "B905"]
