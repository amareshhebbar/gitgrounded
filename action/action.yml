name: GitGrounded
description: Regression test LLM prompts, models, tools and agents on every pull request, with a signed, verifiable evidence bundle
author: Amaresh Hebbar
branding:
  icon: check-circle
  color: green

inputs:
  suite:
    description: Suite name from gitgrounded.yml (default first suite)
    required: false
    default: ""
  base:
    description: Baseline git ref
    required: false
    default: ""
  head:
    description: Candidate git ref
    required: false
    default: HEAD
  working-directory:
    description: Directory that contains gitgrounded.yml
    required: false
    default: "."
  version:
    description: gitgrounded version to install (empty for latest); use "local" to install from the checked out repo
    required: false
    default: ""
  python-version:
    description: Python version
    required: false
    default: "3.12"
  sign:
    description: auto, sigstore, local or none
    required: false
    default: auto
  attest:
    description: Create a GitHub artifact attestation for the bundle (needs attestations write and id-token write)
    required: false
    default: "true"
  comment:
    description: Post or update one sticky PR comment with the result
    required: false
    default: "true"
  comment-footer:
    description: Add a short "checked by GitGrounded" footer to the PR comment
    required: false
    default: "true"
  fail-on:
    description: fail, warn or never
    required: false
    default: fail
  quick:
    description: Run the quick subset
    required: false
    default: "false"
  minimal:
    description: Use the mutation minimized suite
    required: false
    default: "false"
  offline-fallback:
    description: When no provider key is available (for example on pull requests from forks) run in offline simulation mode instead of failing
    required: false
    default: "true"
  extra-args:
    description: Extra arguments for gitgrounded run
    required: false
    default: ""

outputs:
  verdict:
    description: PASS, WARN or FAIL
    value: ${{ steps.run.outputs.verdict }}
  bundle:
    description: Path to the evidence bundle
    value: ${{ steps.run.outputs.bundle }}
  exit-code:
    description: gitgrounded exit code
    value: ${{ steps.run.outputs.exit_code }}
  offline:
    description: true when the run used offline simulation
    value: ${{ steps.run.outputs.offline }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        GG_VERSION: ${{ inputs.version }}
        GG_SIGN: ${{ inputs.sign }}
        GG_FAIL_ON: ${{ inputs.fail-on }}
        GG_BASE: ${{ inputs.base }}
        GG_HEAD: ${{ inputs.head }}
        GG_SUITE: ${{ inputs.suite }}
      run: |
        set -eu
        if [ -n "$GG_VERSION" ] && ! printf '%s' "$GG_VERSION" | grep -Eq '^(local|[0-9][0-9A-Za-z.+!]*)$'; then
          echo "::error::invalid version input"
          exit 2
        fi
        case "$GG_SIGN" in auto|sigstore|local|none) ;; *) echo "::error::invalid sign input"; exit 2 ;; esac
        case "$GG_FAIL_ON" in fail|warn|never) ;; *) echo "::error::invalid fail-on input"; exit 2 ;; esac
        for ref in "$GG_BASE" "$GG_HEAD"; do
          if [ -n "$ref" ] && ! git check-ref-format --allow-onelevel "$ref" >/dev/null 2>&1 && ! printf '%s' "$ref" | grep -Eq '^(HEAD|[0-9a-fA-F]{7,40})([~^][0-9]*)*$'; then
            echo "::error::invalid git ref input"
            exit 2
          fi
        done
        if [ -n "$GG_SUITE" ] && ! printf '%s' "$GG_SUITE" | grep -Eq '^[A-Za-z0-9_.]+$'; then
          echo "::error::invalid suite input"
          exit 2
        fi

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install gitgrounded
      shell: bash
      env:
        GG_VERSION: ${{ inputs.version }}
        GG_WORKSPACE: ${{ github.workspace }}
      run: |
        set -eu
        if [ "$GG_VERSION" = "local" ]; then
          pip install "${GG_WORKSPACE}[sign]"
        elif [ -n "$GG_VERSION" ]; then
          pip install "gitgrounded[sign]==${GG_VERSION}"
        else
          pip install "gitgrounded[sign]"
        fi

    - name: Restore cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ inputs.working-directory }}/.gitgrounded/cache
        key: gitgrounded-${{ runner.os }}-${{ hashFiles(format('{0}/gitgrounded.yml', inputs.working-directory)) }}-${{ github.sha }}
        restore-keys: |
          gitgrounded-${{ runner.os }}-${{ hashFiles(format('{0}/gitgrounded.yml', inputs.working-directory)) }}-
          gitgrounded-${{ runner.os }}-

    - name: Run gitgrounded
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GG_BASE: ${{ inputs.base }}
        GG_HEAD: ${{ inputs.head }}
        GG_SUITE: ${{ inputs.suite }}
        GG_SIGN: ${{ inputs.sign }}
        GG_FAIL_ON: ${{ inputs.fail-on }}
        GG_QUICK: ${{ inputs.quick }}
        GG_MINIMAL: ${{ inputs.minimal }}
        GG_EXTRA: ${{ inputs.extra-args }}
        GG_OFFLINE_FALLBACK: ${{ inputs.offline-fallback }}
        GG_BASE_REF: ${{ github.base_ref }}
        GG_IS_FORK: ${{ github.event.pull_request.head.repo.fork == true }}
      run: |
        set -u
        BASE="$GG_BASE"
        if [ -z "$BASE" ]; then
          if [ -n "$GG_BASE_REF" ]; then BASE="origin/$GG_BASE_REF"; else BASE="HEAD~1"; fi
        fi
        if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then
          echo "::warning::shallow checkout detected; add fetch-depth: 0 to actions/checkout so the base ref can be resolved"
          git fetch --quiet --unshallow 2>/dev/null || true
        fi
        OFFLINE=false
        SIGN="$GG_SIGN"
        HAVE_KEY=false
        for v in ANTHROPIC_API_KEY OPENAI_API_KEY GROQ_API_KEY DEEPSEEK_API_KEY GITGROUNDED_ANTHROPIC_API_KEY GITGROUNDED_CLAUDE_API_KEY GITGROUNDED_OPENAI_API_KEY GITGROUNDED_GROQ_API_KEY GITGROUNDED_DEEPSEEK_API_KEY GITGROUNDED_CUSTOM_API_KEY; do
          if [ -n "${!v:-}" ]; then HAVE_KEY=true; fi
        done
        if [ "$HAVE_KEY" = "false" ] && [ "${GITGROUNDED_OFFLINE:-0}" != "1" ] && [ "$GG_OFFLINE_FALLBACK" = "true" ]; then
          export GITGROUNDED_OFFLINE=1
          echo "::notice::no provider key available (fork pull request or missing secret); running offline simulation, numbers are illustrative"
        fi
        if [ "${GITGROUNDED_OFFLINE:-0}" = "1" ]; then OFFLINE=true; fi
        if [ "$GG_IS_FORK" = "true" ] && [ "$SIGN" = "auto" ]; then SIGN=local; fi
        OUT="${RUNNER_TEMP}/gitgrounded"
        mkdir -p "$OUT"
        ARGS=(run --base "$BASE" --head "$GG_HEAD" --bundle "$OUT/evidence.ggb" --sign "$SIGN" --markdown "$OUT/summary.md" --html "$OUT/report.html" --junit "$OUT/junit.xml" --json-out "$OUT/result.json" --fail-on "$GG_FAIL_ON")
        if [ -n "$GG_SUITE" ]; then ARGS+=(--suite "$GG_SUITE"); fi
        if [ "$GG_QUICK" = "true" ]; then ARGS+=(--quick); fi
        if [ "$GG_MINIMAL" = "true" ]; then ARGS+=(--minimal); fi
        EXTRA=()
        if [ -n "$GG_EXTRA" ]; then read -r -a EXTRA <<< "$GG_EXTRA"; fi
        set +e
        gitgrounded "${ARGS[@]}" "${EXTRA[@]}"
        CODE=$?
        set -e
        echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
        echo "offline=$OFFLINE" >> "$GITHUB_OUTPUT"
        echo "out=$OUT" >> "$GITHUB_OUTPUT"
        if [ -f "$OUT/result.json" ]; then
          echo "verdict=$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["verdict"])' "$OUT/result.json")" >> "$GITHUB_OUTPUT"
        fi
        if [ -f "$OUT/evidence.ggb" ]; then
          echo "bundle=$OUT/evidence.ggb" >> "$GITHUB_OUTPUT"
          python -c 'import zipfile,sys;open(sys.argv[2],"wb").write(zipfile.ZipFile(sys.argv[1]).read("manifest.json"))' "$OUT/evidence.ggb" "$OUT/manifest.json"
        fi
        if [ "$OFFLINE" = "true" ] && [ -f "$OUT/summary.md" ]; then
          printf '\n> Offline simulation: no provider key was available, so these numbers are illustrative. Rerun with a key for real results.\n' >> "$OUT/summary.md"
        fi

    - name: Attest evidence bundle
      if: ${{ inputs.attest == 'true' && steps.run.outputs.bundle != '' && steps.run.outputs.offline != 'true' && github.event.pull_request.head.repo.fork != true }}
      uses: actions/attest@ce27ba3b4a9a139d9a20a4a07d69fabb52f1e5bc
      with:
        subject-path: ${{ steps.run.outputs.bundle }}
        predicate-type: https://amareshhebbar.github.io/gitgrounded/attestation/eval-run/v1
        predicate-path: ${{ steps.run.outputs.out }}/manifest.json

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gitgrounded-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.run.outputs.out }}
        if-no-files-found: ignore

    - name: Sticky PR comment
      if: ${{ always() && inputs.comment == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true && steps.run.outputs.out != '' }}
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
      env:
        SUMMARY_PATH: ${{ steps.run.outputs.out }}/summary.md
        GG_FOOTER: ${{ inputs.comment-footer }}
      with:
        script: |
          const fs = require('fs');
          if (!fs.existsSync(process.env.SUMMARY_PATH)) { return; }
          const marker = '<!-- gitgrounded-report -->';
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          let body = fs.readFileSync(process.env.SUMMARY_PATH, 'utf8') + `\n[Run, HTML report and evidence bundle](${runUrl})\n`;
          if (process.env.GG_FOOTER === 'true') {
            body += '\n<sub>Checked by [GitGrounded](https://github.com/amareshhebbar/gitgrounded)</sub>\n';
          }
          if (!body.includes(marker)) { body = marker + '\n' + body; }
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
          }

    - name: Apply verdict
      shell: bash
      env:
        GG_EXIT: ${{ steps.run.outputs.exit_code }}
      run: exit "${GG_EXIT:-2}"
