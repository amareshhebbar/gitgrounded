[build]
  publish = "deploy/netlify"
  command = ""

[[redirects]]
  from = "/"
  to = "/docs/introduction"
  status = 302
  force = true

[[redirects]]
  from = "/*"
  to = "https://gitgrounded.mintlify.site/:splat"
  status = 200
  force = true
  headers = {Origin = "gitgrounded.mintlify.site"}

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"